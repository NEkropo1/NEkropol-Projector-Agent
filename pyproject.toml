
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-agent"
version = "0.1.0"
description = "NEkropol Projector — an entertainment-only persona projector with LangGraph + FastAPI"
authors = [
  {name="NEkropol", email="nekrjkeee@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "langchain>=0.2.13",
  "langgraph>=0.2.27",
  "openai>=1.50.0",
  "httpx>=0.27.0",
  "tenacity>=8.3.0",
  "hypercorn[uvloop]>=0.16.0",
  "python-dotenv>=1.0.1",
  "beautifulsoup4>=4.13.5",
  "lxml>=6.0.1",
  "docker>=7.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
